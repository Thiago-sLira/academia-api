spring.application.name=academia-api
spring.application.version=@project.version@

# Banco de Dados via Variáveis de Ambiente
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-mute-frost-acsjdfkt.sa-east-1.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Segurança — BCrypt strength (rounds de hashing de senha)
security.bcrypt.strength=10

# Segurança — JWT
security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
security.jwt.expiration=${JWT_EXPIRATION:86400000}